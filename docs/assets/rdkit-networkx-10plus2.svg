<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960" role="img" aria-labelledby="title desc">
<title id="title">From RDKit molecule to NetworkX and a 10+2 qubit encoding</title>
<desc id="desc">Aspirin has 13 heavy atoms. RDKit supplies atom and bond chemistry; NetworkX represents the heavy-atom graph. Chemistry-aware greedy coverage selects ten atoms for individual qubits, while the remaining three contribute to two lossy global tail summaries.</desc>
<rect width="1680" height="960" rx="28" fill="#f7fafc"/>
<text x="56" y="58" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#18324b">From molecular graph to a fixed-width quantum map</text>
<text x="56" y="94" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#53677b">Worked example · aspirin · 13 heavy atoms · default CHEMICAL_COVERAGE selector</text>
<rect x="36" y="126" width="786" height="754" rx="22" fill="#ffffff" stroke="#c6d4df"/>
<rect x="858" y="126" width="786" height="754" rx="22" fill="#ffffff" stroke="#c6d4df"/>
<text x="68" y="170" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#18324b">01  Chemistry → attributed graph</text>
<text x="68" y="203" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53677b">RDKit parses; NetworkX holds one node per heavy atom and one edge per bond</text>
<text x="890" y="170" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#18324b">02  Greedy selection → 10 + 2 wires</text>
<text x="890" y="203" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#53677b">Ten atoms stay individual; the complete residual tail feeds two summaries</text>
